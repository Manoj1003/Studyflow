<style>
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--bg:#f6f3ee;--card:#fffdf9;--tx:#2b2622;--mut:#8a8178;--bd:#e8e1d6;--ac:#7c6cf0;--ph:var(--ac);--sh:0 6px 24px rgba(60,40,20,.08);--l0:#ece6dc;--l1:#cfe6c9;--l2:#9fd29a;--l3:#5fb66a;--l4:#2f8f4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);transition:background .3s}
h1,h2,h3{font-family:Georgia,serif;margin:.2em 0}main{max-width:1100px;margin:auto;padding:16px 16px 90px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.sub{color:var(--mut);font-size:13px}.hide{display:none!important}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-1px);border-color:var(--ph)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.pri,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1100px;margin:auto;padding:14px 16px 0}
.brand{font:700 22px Georgia,serif;margin-right:auto}.pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px}

.hero{text-align:center;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--ac) 12%,var(--card)))}

.hw{overflow-x:auto;display:flex;gap:6px;padding-bottom:6px}.hg,.hl{display:grid;grid-template-rows:repeat(7,12px);gap:3px;font-size:9px;color:var(--mut)}.hg{grid-auto-flow:column;grid-auto-columns:12px}.hg i{border-radius:3px;background:var(--l0)}
.l1{background:var(--l1)!important}.l2{background:var(--l2)!important}.l3{background:var(--l3)!important}.l4{background:var(--l4)!important}

  return`<div class=ctl style="justify-content:space-between"><h3>Study activity</h3><div class=ctl><button class="${HR.mode==='r'?'on':''}" data-act="hy:r">Last 12 months</button><button class="${HR.mode==='y'&&HR.y===y?'on':''}" data-act="hy:${y}">${y}</button><button class="${HR.mode==='y'&&HR.y===y-1?'on':''}" data-act="hy:${y-1}">${y-1}</button><input type=date data-h=a value="${HR.a}" aria-label="From"><input type=date data-h=b value="${HR.b}" aria-label="To"></div></div><div class=hw id=hb>${heatBody()}</div><div class=sub>Less ${[0,1,2,3,4].map(l=>`<i class="l${l}" style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--l0);vertical-align:middle"></i>`).join(' ')} More · today is outlined</div>`
}
function hourData(day){
  const H=Array.from({length:24},()=>({t:0,s:{}})),d0=pd(day);d0.setHours(0,0,0,0);const s0=d0.getTime();
  study().forEach(x=>{const a=Math.max(x.start,s0),b=Math.min(x.end,s0+864e5);if(b<=a)return;
    for(let h=Math.floor((a-s0)/36e5);h<24&&s0+h*36e5<b;h++){const o=Math.min(b,s0+(h+1)*36e5)-Math.max(a,s0+h*36e5);if(o>0){H[h].t+=o/1000;H[h].s[x.subject]=(H[h].s[x.subject]||0)+o/1000}}});
  return H
}
function rangeData(n){
  const t=dk(Date.now()),bd={};study().forEach(x=>{const k=dk(x.start),o=bd[k]=bd[k]||{};o[x.subject]=(o[x.subject]||0)+x.dur});
  const g=n<=90?'d':n<=180?'w':'m',B=[],idx={};
  for(let i=n-1;i>=0;i--){const k=dd(t,-i),key=g==='d'?k:g==='w'?mon(k):k.slice(0,7);if(!(key in idx)){idx[key]=B.length;B.push({key,s:{},t:0})}const b=B[idx[key]],o=bd[k]||{};for(const sj in o){b.s[sj]=(b.s[sj]||0)+o[sj];b.t+=o[sj]}}
  return{g,B}
}
function chartBody(){
  const t=dk(Date.now()),day=CR.r==='day',dy=CR.day||t;let P=[],g='d';
  if(day){const H=hourData(dy),last=dy===t?new Date().getHours():23;let c=0;P=H.slice(0,last+1).map((h,i)=>{c+=h.t;return{l:pad(i)+':00',tip:pad(i)+':00 – '+pad(i+1)+':00',v:(CR.m==='cum'?c:h.t)/3600,s:h.s,t:h.t,c}})}
  else{const R=rangeData(+CR.r);g=R.g;P=R.B.map(b=>({l:g==='m'?pd(b.key+'-01').toLocaleDateString('en-US',{month:'short'}):pd(b.key).toLocaleDateString('en-US',{day:'numeric',month:'short'}),tip:g==='d'?fl(b.key):g==='w'?'Week of '+fl(b.key):pd(b.key+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'}),v:b.t/3600,s:b.s,t:b.t}))}
  const n=P.length,W=680,Ht=260,ml=48,mr=16,mt=16,mb=36,iw=W-ml-mr,ih=Ht-mt-mb,N=day?24:Math.max(n,2);
  const ymax=day&&CR.m!=='cum'?1:Math.max(1,Math.ceil(Math.max(0,...P.map(p=>p.v))*1.1));
  const X=i=>ml+(N>1?i/(N-1):.5)*iw,Y=v=>mt+ih*(1-Math.min(v,ymax)/ymax);
  const grid=[0,1,2,3,4].map(j=>{const v=ymax*j/4;return`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${ml-6}" y="${Y(v)+3}" text-anchor="end">${hh(v)}</text>`}).join('');
  const every=day?3:Math.ceil(N/8);
  const xl=Array.from({length:N},(_,i)=>i%every?'':`<text x="${X(i)}" y="${Ht-14}" text-anchor="middle">${day?pad(i)+':00':(P[i]?P[i].l:'')}</text>`).join('');
  const pts=P.map((p,i)=>[X(i),Y(p.v)]),line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=n>1?`<path d="${line} L${pts[n-1][0].toFixed(1)} ${mt+ih} L${pts[0][0].toFixed(1)} ${mt+ih}Z" fill="var(--ac)" opacity=".12"/>`:'';
  const si=CR.sel>=0&&CR.sel<n?CR.sel:n-1;
  const dots=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===si?6:P[i].v>0?4:3}" fill="${i===si?'var(--ac)':'var(--card)'}" stroke="var(--ac)" stroke-width="2"/><circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="13" fill="transparent" style="cursor:pointer" data-act="pt:${i}"><title>${P[i].tip}: ${hms(P[i].t)}</title></circle>`).join('');
  const p=P[si],rows=Object.entries(p.s).sort((a,b)=>b[1]-a[1]);
  const det=`<div class=det><b>${p.tip}</b> · ${hms(p.t)} studied${day&&CR.m==='cum'?' · '+hms(p.c)+' so far today':''}${rows.map(([id,s])=>`<div class=hrow><span class=dot style="background:${sCol(id)}"></span><span>${esc(sName(id))}</span><b>${hms(s)}</b><span class=sub>${(s/3600).toFixed(2)}h</span></div>`).join('')||'<div class=sub style="margin-top:6px">No study recorded in this period.</div>'}</div>`;
  return`<div class=cw><svg viewBox="0 0 ${W} ${Ht}" role=img aria-label="Study hours line chart">${grid}${xl}${area}<path d="${line}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>${det}`
}

  return`<div class=ctl style="justify-content:space-between"><h3>Study hours</h3><div class=ctl>${dv?`<button data-act="cd:-1" aria-label="Previous day">‹</button><input type=date data-c=day value="${CR.day||t}" max="${t}" aria-label="Day"><button data-act="cd:1" aria-label="Next day">›</button><select data-c=m aria-label="Graph type"><option value=hour ${CR.m==='hour'?'selected':''}>Per hour</option><option value=cum ${CR.m==='cum'?'selected':''}>Cumulative</option></select>`:''}<select data-c=r aria-label="Range">${[['day','Day (24h)'],['7','7 days'],['30','30 days'],['90','3 months'],['180','6 months'],['365','1 year']].map(([v,l])=>`<option value=${v} ${String(CR.r)===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div id=cb>${chartBody()}</div>`

function subjectBars(){
  const t={};study().forEach(s=>t[s.subject]=(t[s.subject]||0)+s.dur);const e=Object.entries(t).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...e.map(x=>x[1]));
  return`<h3>Study time by subject</h3>${e.map(([id,s])=>`<div class=hrow><span class=dot style="background:${sCol(id)}"></span><span style="width:110px">${esc(sName(id))}</span><div class=bar style="flex:1"><i style="width:${s/mx*100}%;background:${sCol(id)}"></i></div><span class=sub>${hmm(s)}</span></div>`).join('')||'<p class=sub>No sessions yet.</p>'}`

let PR='all';
function pieBody(){
  const c=PR==='all'?'':dd(dk(Date.now()),-(+PR-1)),t={};
  study().forEach(s=>{if(PR==='all'||dk(s.start)>=c)t[s.subject]=(t[s.subject]||0)+s.dur});
  const e=Object.entries(t).sort((a,b)=>b[1]-a[1]),tot=e.reduce((a,x)=>a+x[1],0);let cum=0;
  const arcs=e.map(([id,s])=>{const p=s/tot*100,o=25-cum;cum+=p;return`<circle cx=21 cy=21 r=15.9155 fill=none stroke="${sCol(id)}" stroke-width=6 stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"><title>${esc(sName(id))}: ${hms(s)} (${p.toFixed(1)}%)</title></circle>`}).join('');
  return tot?`<div class=pie><svg viewBox="0 0 42 42" role=img aria-label="Pie chart of study time by subject"><circle cx=21 cy=21 r=15.9155 fill=none stroke="var(--l0)" stroke-width=6 />${arcs}<text x=21 y=21.5 text-anchor=middle style="font:700 4.6px Georgia,serif;fill:var(--tx)">${(tot/3600).toFixed(2)}h</text><text x=21 y=26 text-anchor=middle style="font:2.6px system-ui;fill:var(--mut)">total</text></svg><div class=leg>${e.map(([id,s])=>`<div class=hrow><span class=dot style="background:${sCol(id)}"></span><span>${esc(sName(id))}</span><b>${hms(s)}</b><span class=sub>${Math.round(s/tot*100)}%</span></div>`).join('')}</div></div>`:'<p class=sub>No sessions in this period yet.</p>'
}

function photoEdit(im){
  PE={im,x:0,y:0,z:1,r:0,b:1};
  openM(`<h3>Adjust your photo</h3><canvas id=pc width=260 height=260 style="width:100%;max-width:260px;margin:auto;border-radius:16px;touch-action:none;cursor:grab;background:#000"></canvas><p class=sub style="text-align:center;margin:0">Drag to reposition. Scroll or use the sliders to zoom.</p><label class=sub>Zoom<input type=range min=1 max=3 step=.01 value=1 data-pe=z class=vol></label><label class=sub>Brightness<input type=range min=.6 max=1.4 step=.01 value=1 data-pe=b class=vol></label><div class=ctl><button data-act="perot:-1" aria-label="Rotate left">⟲ Rotate</button><button data-act="perot:1" aria-label="Rotate right">⟳ Rotate</button><button data-act=pereset>Reset</button></div><div class=ctl><button class=pri data-act=pesave>Save photo</button><button data-act=cm>Cancel</button></div>`);
  const c=$('#pc');let d=null;
  c.onpointerdown=e=>{d={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);c.style.cursor='grabbing'};
  c.onpointermove=e=>{if(!d)return;const k=260/c.getBoundingClientRect().width;PE.x+=(e.clientX-d.x)*k;PE.y+=(e.clientY-d.y)*k;d={x:e.clientX,y:e.clientY};peDraw()};
  c.onpointerup=c.onpointercancel=()=>{d=null;c.style.cursor='grab'};
  c.onwheel=e=>{e.preventDefault();PE.z=Math.min(3,Math.max(1,PE.z*(e.deltaY<0?1.06:.94)));$('[data-pe=z]').value=PE.z;peDraw()};
  peDraw()
}
function peDraw(c,size){
  const cv=c||$('#pc');if(!cv||!PE)return;
  const Z=size||260,k=Z/260,g2=cv.getContext('2d'),w=PE.r%2?PE.im.height:PE.im.width,h=PE.r%2?PE.im.width:PE.im.height,sc=Math.max(260/w,260/h)*PE.z;
  const mx=Math.max(0,(w*sc-260)/2),my=Math.max(0,(h*sc-260)/2);PE.x=Math.max(-mx,Math.min(mx,PE.x));PE.y=Math.max(-my,Math.min(my,PE.y));
  g2.fillStyle='#fff';g2.fillRect(0,0,Z,Z);g2.save();g2.filter='brightness('+PE.b+')';g2.translate(Z/2+PE.x*k,Z/2+PE.y*k);g2.rotate(PE.r*Math.PI/2);g2.scale(sc*k,sc*k);g2.drawImage(PE.im,-PE.im.width/2,-PE.im.height/2);g2.restore();
  if(!size){g2.fillStyle='rgba(0,0,0,.5)';g2.beginPath();g2.rect(0,0,260,260);g2.arc(130,130,128,0,Math.PI*2,true);g2.fill('evenodd');g2.strokeStyle='#fff';g2.lineWidth=2;g2.beginPath();g2.arc(130,130,128,0,Math.PI*2);g2.stroke()}
}

document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;if(!U)return;
  if(d.k){const v=t.type==='checkbox'?+t.checked:t.type==='number'||t.type==='range'?+t.value:t.value;D.set[d.k]=v;
    if(['study','short','long','cycles'].includes(d.k)&&T.status==='idle'&&T.mode==='pomodoro')setPhase(T.phase);theme();if(d.k==='vol'){save();return}upd()}
  else if(d.o){T[d.o]=Math.max(1,+t.value);if(T.status==='idle')setPhase(T.phase);upd()}
  else if(d.h){HR.mode='c';HR[d.h]=t.value;render()}
  else if(d.c){CR[d.c]=t.value;CR.sel=-1;render()}
  else if(d.f){HF[d.f]=t.value;render()}
  else if(d.u){D.prof.name=t.value;save()}
  else if(d.pr!==undefined){PR=t.value;render()}
  else if(d.p){photoPick(t.files[0]);t.value=''}
});
function kd(e){
  if(!U){if(e.key==='Enter')auth();return}
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.key!=='Escape')return;
  const k=e.key.toLowerCase();
  if(e.key===' '){e.preventDefault();A.toggle()}else if(k==='r')reset();else if(k==='s')skip();else if(k==='p')pop();else if(k==='f')A.full();else if(e.key==='?')A.help();
  else if(k==='escape'){pipWin?.close();$('#fl').classList.add('hide');closeM();$('#help').classList.remove('show')}
}
